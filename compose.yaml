services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
  web:
    build: .
    env_file: [.env, config/experiment.env]
    environment: &app_environment
      DB_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
      API_URL: http://api:8001
    volumes: &app_volumes
      - ./media:/app/media
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
  api:
    build: .
    env_file: [.env, config/experiment.env]
    environment: *app_environment
    volumes: *app_volumes
    command: ["uvicorn", "assistant.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
  worker:
    build: .
    env_file: [.env, config/experiment.env]
    environment: *app_environment
    volumes: *app_volumes
    command: ["python", "manage.py", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
volumes:
  postgres_data:
  qdrant_data:
  uploads:
